name: relay-body-inject-poc
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  relay:
    if: ${{ !startsWith(github.event.issue.title, '[RELAYED]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Relay (mirror of shared cross-repo-bug-relay.yml body construction)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_URL: ${{ github.event.issue.html_url }}
          SOURCE_TITLE: ${{ github.event.issue.title }}
          SOURCE_BODY: ${{ github.event.issue.body }}
          KIND: issue
        run: |
          set -euo pipefail
          BODY=$(cat <<'RELAY_EOF'
          <!-- relay-metadata
          kind: PLACEHOLDER_KIND
          source_repo: PLACEHOLDER_REPO
          source_issue: PLACEHOLDER_NUMBER
          source_url: PLACEHOLDER_URL
          -->

          _Relayed from PLACEHOLDER_REPO PLACEHOLDER_KIND #PLACEHOLDER_NUMBER_

          ---

          RELAY_EOF
          )
          BODY="${BODY//PLACEHOLDER_KIND/$KIND}"
          BODY="${BODY//PLACEHOLDER_REPO/$SOURCE_REPO}"
          BODY="${BODY//PLACEHOLDER_NUMBER/$SOURCE_NUMBER}"
          BODY="${BODY//PLACEHOLDER_URL/$SOURCE_URL}"
          BODY="${BODY}

          ${SOURCE_BODY}"
          echo "-----RELAYED-BODY-START-----"
          printf '%s\n' "$BODY"
          echo "-----RELAYED-BODY-END-----"
          gh issue create --repo "$SOURCE_REPO" --title "[RELAYED] ${SOURCE_TITLE}" --body "$BODY"
